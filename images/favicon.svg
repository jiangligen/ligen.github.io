<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- 极简直角背景 -->
  <rect x="0" y="0" width="100" height="100" fill="#007AFF" />

  <!-- ==================== -->
  <!-- 左侧：偏旁“三点水” (保持原本形状与粗细，整组偏移平移) -->
  <!-- ==================== -->
  <!-- 顶部长横 -->
  <rect x="14" y="24" width="30" height="12" fill="#FFFFFF" />
  <!-- 中间横 (加长版，两端微缩 4 个单位) -->
  <rect x="18" y="44" width="22" height="12" fill="#FFFFFF" />
  <!-- 底部长横 -->
  <rect x="14" y="64" width="30" height="12" fill="#FFFFFF" />

  <!-- ==================== -->
  <!-- 右侧：“工”字部分 (保持原本路径构造，整体平移对齐) -->
  <!-- ==================== -->
  <path d="M 50 24 H 86 V 36 H 75 V 64 H 86 V 76 H 50 V 64 H 61 V 36 H 50 Z" fill="#FFFFFF" />
</svg>
