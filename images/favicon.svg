<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- 极简直角背景 -->
  <rect x="0" y="0" width="100" height="100" fill="#007AFF" />

  <!-- ==================== -->
  <!-- 左侧：偏旁“三点水” (宽度 30，占比 5) -->
  <!-- ==================== -->
  <!-- 顶部长横 -->
  <rect x="11" y="24" width="30" height="12" fill="#FFFFFF" />
  <!-- 中间横 (加长版，两端微缩 4 个单位) -->
  <rect x="15" y="44" width="22" height="12" fill="#FFFFFF" />
  <!-- 底部长横 -->
  <rect x="11" y="64" width="30" height="12" fill="#FFFFFF" />

  <!-- ==================== -->
  <!-- 右侧：“工”字部分 (宽度 36，占比 6，紧靠左侧) -->
  <!-- ==================== -->
  <!-- 
    M 47 24 : 从左侧 11 + 宽度 30 + 间距 6 = 47 开始
    H 83    : 顶部横杠划向右侧 (47 + 36 = 83)
    V 36    : 往下
    H 72    : 顶部横杠向内缩进，留出中间 10 单位的竖杠 (83 - 11 = 72)
    V 64    : 垂直画出中间的竖杠
    H 83    : 底部横杠向外拉出
    V 76    : 到底部
    H 47    : 回到左侧
    V 64    : 往上
    H 58    : 底部横杠向内缩进 (47 + 11 = 58)
    V 36    : 垂直向上画出竖杠的左侧
    H 47    : 向外补齐顶部横杠
    Z       : 闭合路径
  -->
  <path d="M 47 24 H 83 V 36 H 72 V 64 H 83 V 76 H 47 V 64 H 58 V 36 H 47 Z" fill="#FFFFFF" />
</svg>
